<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Oh My Pi 17.1.3 源码深度拆解：从 CLI、Agent Loop、工具系统到上下文、会话、插件、多代理、记忆和原生层。"
    />
    <meta name="theme-color" content="#315c4f" />
    <title>Oh My Pi 17.1.3 源码深度拆解</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css"
    />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div id="app">文档加载中…</div>
    <noscript>请启用 JavaScript 以阅读这套 Docsify 文档。</noscript>

    <script>
      window.$docsify = {
        name: "Oh My Pi 源码拆解",
        repo: "Hanqing/oh-my-pi-notes",
        homepage: "README.md",
        loadSidebar: true,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md"
        },
        coverpage: true,
        auto2top: true,
        maxLevel: 4,
        subMaxLevel: 3,
        relativePath: true,
        executeScript: false,
        search: {
          paths: "auto",
          placeholder: "搜索全文",
          noData: "没有找到结果",
          depth: 4,
          hideOtherSidebarContent: false
        },
        mermaidConfig: {
          querySelector: ".mermaid"
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-rust.min.js"></script>
  </body>
</html>
